<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodVibe - 校園美食命運轉盤</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
  .chip { display:block; padding:.4rem .9rem; border-radius:9999px; border:2px solid #fed7aa; background:#fff;
          color:#9a3412; font-weight:600; font-size:.9rem; transition:all .15s ease; cursor:pointer; }
  .chip:hover { border-color:#fb923c; transform:translateY(-1px); }
  input:checked + .chip.include { background:#f97316; border-color:#f97316; color:#fff; box-shadow:0 4px 10px rgba(249,115,22,.3); }
  input:checked + .chip.exclude { background:#f43f5e; border-color:#f43f5e; color:#fff; text-decoration:line-through; box-shadow:0 4px 10px rgba(244,63,94,.3); }
  input:checked + .chip.veg { background:#16a34a; border-color:#16a34a; color:#fff; box-shadow:0 4px 10px rgba(22,163,74,.3); }
  input:focus-visible + .chip { outline:3px solid #fdba74; outline-offset:2px; }
  input:disabled + .chip { opacity:.55; cursor:not-allowed; }
  @keyframes pop { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.06);opacity:1} 100%{transform:scale(1)} }
  .pop { animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes hop { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-16px)} 70%{transform:translateY(-4px)} }
  .hop { display:inline-block; animation:hop 1s ease-in-out 3; }
  @keyframes glow { 0%,100%{box-shadow:0 10px 25px rgba(244,63,94,.35),0 0 0 0 rgba(251,146,60,.5)} 50%{box-shadow:0 10px 25px rgba(244,63,94,.35),0 0 0 14px rgba(251,146,60,0)} }
  .glow { animation:glow 1.8s ease-out infinite; }
  .spin-btn:disabled { animation:none; filter:grayscale(.3); cursor:not-allowed; opacity:.85; }
  @media (prefers-reduced-motion: reduce){ .hop,.glow,.pop{animation:none} }
</style>
</head>
<body class="bg-gradient-to-b from-amber-50 via-orange-50 to-rose-50 min-h-screen text-stone-800">
<canvas id="confetti" class="fixed inset-0 pointer-events-none z-40" aria-hidden="true"></canvas>

<!-- Header -->
<header class="bg-gradient-to-r from-orange-500 via-rose-500 to-amber-400 text-white shadow-lg">
  <div class="max-w-4xl mx-auto px-4 py-6 flex items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">🍜 FoodVibe</h1>
      <p class="mt-1 text-sm sm:text-base text-white/90">校園美食命運轉盤｜今天吃什麼，交給命運！</p>
    </div>
    <button id="muteBtn" class="shrink-0 rounded-full bg-white/20 hover:bg-white/30 px-4 py-2 text-sm font-semibold backdrop-blur" aria-pressed="false" title="開關音效">🔊 音效</button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

  <!-- Settings -->
  <section class="bg-white rounded-3xl shadow-md p-5 sm:p-6 border border-orange-100">
    <h2 class="text-lg font-bold text-orange-600 mb-4">📍 基本設定</h2>
    <div class="max-w-md">
      <div>
        <label for="school" class="block text-sm font-semibold text-stone-600 mb-1">學校</label>
        <select id="school" class="w-full rounded-xl border-2 border-orange-200 bg-white px-3 py-2.5 font-medium focus:outline-none focus:border-orange-400">
          <option>國立臺灣海洋大學</option>
          <option>國立臺灣大學</option>
          <option>國立成功大學</option>
          <option>國立清華大學</option>
          <option value="__custom">自行輸入…</option>
        </select>
        <input id="customSchool" type="text" maxlength="40" placeholder="輸入學校或地點，例如：國立政治大學"
               class="hidden mt-2 w-full rounded-xl border-2 border-orange-200 px-3 py-2.5 focus:outline-none focus:border-orange-400">
      </div>
    </div>
  </section>

  <!-- Filters -->
  <section class="bg-white rounded-3xl shadow-md p-5 sm:p-6 border border-orange-100 space-y-5">
    <h2 class="text-lg font-bold text-orange-600">🎛️ 條件篩選</h2>
    <div>
      <p class="text-sm font-semibold text-stone-600 mb-2">不想吃的口味 <span class="font-normal text-stone-400">（勾選＝排除）</span></p>
      <div id="cuisineChips" class="flex flex-wrap gap-2"></div>
    </div>
    <div>
      <p class="text-sm font-semibold text-stone-600 mb-2">不吃的東西 / 避雷 <span class="font-normal text-stone-400">（勾選＝排除；「只吃素食」＝僅出現素食料理）</span></p>
      <div id="avoidChips" class="flex flex-wrap gap-2"></div>
    </div>
    <div>
      <p class="text-sm font-semibold text-stone-600 mb-2">價格範圍 <span class="font-normal text-stone-400">（可複選，單位：元）</span></p>
      <div id="priceChips" class="flex flex-wrap gap-2"></div>
    </div>
  </section>

  <!-- Wheel -->
  <section class="bg-white rounded-3xl shadow-md p-5 sm:p-6 border border-orange-100">
    <h2 class="text-lg font-bold text-orange-600 mb-1">🎡 命運大轉盤</h2>
    <p id="poolInfo" class="text-sm text-stone-500 mb-4" aria-live="polite"></p>

    <div id="emptyNotice" class="hidden mb-4 rounded-2xl bg-amber-50 border-2 border-amber-200 text-amber-800 px-4 py-3 text-sm font-semibold">
      😵 條件太嚴格啦！請稍微放寬條件再試試
    </div>

    <div class="flex flex-col items-center">
      <div id="wheelBox" class="relative w-full max-w-[440px] aspect-square">
        <canvas id="wheel" class="block w-full h-full"></canvas>
        <svg id="pointer" class="absolute left-1/2 -top-1 z-10 drop-shadow-lg" style="width:34px;height:42px;transform:translateX(-50%);transform-origin:50% 25%" viewBox="0 0 40 50" aria-hidden="true">
          <path d="M20 49 L3.5 17 A18 18 0 1 1 36.5 17 Z" fill="#be123c" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="20" cy="17" r="6" fill="#fff"/>
        </svg>
      </div>

      <div class="mt-6 flex flex-col sm:flex-row items-center gap-3 w-full justify-center">
        <button id="spinBtn" class="spin-btn glow w-full sm:w-auto rounded-full bg-gradient-to-r from-rose-500 via-orange-500 to-amber-400 text-white text-xl sm:text-2xl font-extrabold px-10 py-4 hover:scale-105 active:scale-95 transition-transform">
          🎯 開始轉動命運！
        </button>
        <button id="shuffleBtn" class="hidden rounded-full border-2 border-orange-300 text-orange-600 font-semibold px-5 py-3 hover:bg-orange-50 transition">🔀 換一批料理</button>
      </div>
    </div>
  </section>

  <!-- Result -->
  <section id="result" class="hidden scroll-mt-4 bg-white rounded-3xl shadow-xl p-5 sm:p-6 border-2 border-orange-300" aria-live="polite">
    <div id="resultCard" class="text-center">
      <p class="text-stone-500 font-semibold">🎉 恭喜！今天命定美食是：</p>
      <div id="resultEmoji" class="hop text-7xl my-3"></div>
      <h3 id="resultName" class="text-4xl sm:text-5xl font-extrabold bg-gradient-to-r from-rose-500 to-orange-500 bg-clip-text text-transparent"></h3>
      <div id="resultTags" class="mt-4 flex flex-wrap justify-center gap-2"></div>

      <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
        <button id="againBtn" class="rounded-full border-2 border-orange-400 text-orange-600 font-bold px-7 py-3 hover:bg-orange-50 transition">🔄 再轉一次</button>
        <button id="acceptBtn" class="rounded-full bg-gradient-to-r from-orange-500 to-rose-500 text-white font-bold px-7 py-3 shadow-lg hover:scale-105 active:scale-95 transition-transform">✅ 接受命運</button>
      </div>
      <p id="acceptNote" class="hidden mt-4 rounded-2xl bg-emerald-50 text-emerald-700 font-bold px-4 py-3"></p>
    </div>

    <div id="mapWrap" class="mt-6 scroll-mt-4">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-2">
        <h4 class="font-bold text-orange-600">🗺️ 附近店家搜尋</h4>
        <span id="mapHint" class="text-xs text-stone-500"></span>
      </div>
      <div class="overflow-hidden rounded-2xl border-2 border-orange-100 bg-orange-50">
        <iframe id="mapFrame" title="Google Maps 搜尋結果" class="w-full h-80 sm:h-96 block" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <a id="mapLink" target="_blank" rel="noopener noreferrer"
         class="mt-3 flex items-center justify-center gap-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 transition">
        📌 開啟 Google Maps 查看詳細店家與評價
      </a>
    </div>
  </section>
</main>

<footer class="text-center text-xs text-stone-400 pb-8 px-4">FoodVibe · 料理資料為常見示意，實際營業資訊請以 Google Maps 為準</footer>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="pop bg-white rounded-3xl p-7 max-w-sm w-full text-center shadow-2xl">
    <div class="text-6xl mb-2">😵</div>
    <h3 id="modalTitle" class="text-xl font-extrabold text-rose-600">條件太嚴格啦！</h3>
    <p class="mt-2 text-stone-600">請稍微放寬條件再試試</p>
    <button id="modalClose" class="mt-5 rounded-full bg-orange-500 hover:bg-orange-600 text-white font-bold px-8 py-2.5">好，我再調整</button>
  </div>
</div>

  const canvas = $('wheel'), ctx = canvas.getContext('2d'), wheelBox = $('wheelBox');
  function draw(){
    const size = wheelBox.clientWidth;
    if (!size) return;
    const dpr = window.devicePixelRatio || 1;
    const px = Math.round(size * dpr);
    if (canvas.width !== px){ canvas.width = px; canvas.height = px; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.font = font(Math.max(16, size * 0.05)); ctx.fillText('條件太嚴格啦！', cx, cy - size * 0.2);
      ctx.font = font(Math.max(13, size * 0.036)); ctx.fillText('請放寬條件再試試', cx, cy + size * 0.2);
    } else {
      const arc = TAU / N;
      for (let i = 0; i < N; i++){
        const a0 = state.rotation + i * arc;

        ctx.fillStyle = fg;
        if (fg === '#fff'){ ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 3; }
        ctx.fillText(label, segR - 16, 0);

    for (let i = 0; i < n; i++){
      parts.push({

    const N = state.wheel.length, arc = TAU / N;

    let target = state.wheel.indexOf(winner);

      // 自行輸入的學校：沒有座標，改用文字搜尋
      const query = school ? `${school} ${d.n}` : d.n;
      $('mapFrame').src = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
      $('mapLink').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      $('mapHint').textContent = school ? `📍 以「${school}」文字搜尋` : '尚未輸入學校，目前為一般搜尋';
    }
  }
  $('acceptBtn').addEventListener('click', () => {
    if (!state.winner) return;
    const note = $('acceptNote');
    note.textContent = `命運已定！出發去吃「${state.winner.n}」吧 🎉`;
    note.classList.remove('hidden');
    $('acceptBtn').textContent = '✅ 命運已接受';
    burst(110); winSound();
    $('mapWrap').scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block:'center'});
  });

  /* ---------- 友善提示 Modal ---------- */
  const modal = $('modal');
  function openModal(){ modal.classList.remove('hidden'); $('modalClose').focus(); }
  function closeModal(){ modal.classList.add('hidden'); }
  $('modalClose').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  /* ---------- 啟動 ---------- */
  rebuild();
})();
</script>
</body>
</html>
